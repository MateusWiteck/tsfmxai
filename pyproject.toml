[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tsfmxai"
version = "0.0.0"
description = "Synthetic time-series benchmarks with known mechanisms and explanation ground truths"
requires-python = ">=3.11,<3.12"
dependencies = [
    "joblib>=1.4,<2",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
learning = [
    "torch>=2.2,<3",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<1",
    "matplotlib>=3.8,<4",
    "pandas>=2.2,<3",
    "pyarrow>=14,<25",
]
release = [
    "safetensors>=0.4,<1",
    "huggingface_hub>=0.23,<1",
]
dev = [
    "pytest>=8,<10",
    "threadpoolctl>=3.2,<4",
    "nbconvert>=7.16,<8",
    "ipykernel>=6.29,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
