name: Publish experiments and report

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notebook-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test website preparation
        run: |
          python -m pip install 'pytest>=8,<9'
          python -m pytest tests/unit/test_notebook_site.py tests/unit/test_report_site.py -q
      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-pictures
      - name: Prepare directory tree
        run: python scripts/prepare_notebook_site.py
      - name: Compile and stage the LaTeX report
        run: python scripts/prepare_report_site.py
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: Render experiments and report page
        run: quarto render --no-execute
      - name: Verify published report
        run: |
          test -s site/relatorio.html
          cmp report/build/main.pdf site/outputs/report/relatorio.pdf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
