metadata-files:
  - outputs/notebook-navigation.yml

project:
  type: website
  output-dir: site
  render:
    - index.qmd
    - relatorio.qmd
    - documentacao.qmd
    - documentation.qmd
    - index-en.qmd
    - report-en.qmd
    - /experiments/**/*.ipynb
    - '!**/.ipynb_checkpoints/**'
  resources:
    - outputs/report/relatorio.pdf

website:
  title: TSFMXAI
  site-url: https://mateuswiteck.github.io/tsfmxai/
  repo-url: https://github.com/MateusWiteck/tsfmxai
  search: true
  navbar:
    left:
      - href: index.qmd
        text: Experimentos
      - href: relatorio.qmd
        text: Relatório
      - href: documentacao.qmd
        text: Documentação
    right:
      - text: "Idioma / Language"
        menu:
          - text: Português
            href: index.qmd
          - text: English
            href: index-en.qmd
      - icon: github
        href: https://github.com/MateusWiteck/tsfmxai
execute:
  enabled: false

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    code-fold: true
    code-summary: Mostrar código
    code-tools: true
    embed-resources: false

lang: pt-BR
